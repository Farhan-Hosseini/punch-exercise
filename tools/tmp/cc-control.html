<!doctype html><meta charset="utf-8"><title>control</title>
<h1>control</h1>
<form id="f">
<label>Card number<input id="payCardNo" type="text" inputmode="numeric" autocomplete="cc-number" maxlength="23" spellcheck="false"></label>
<label>Expiry<input id="payCardExp" type="text" inputmode="numeric" autocomplete="cc-exp" maxlength="7"></label>
<label>Security code<input id="payCardCvc" type="text" inputmode="numeric" autocomplete="cc-csc" maxlength="4"></label>
<button type="submit">Pay</button>
</form>
