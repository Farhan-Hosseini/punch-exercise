<div class="var v-f" data-name="Slot reels">
  <div class="hero-f">
    <p class="label hero-f-label">Ultimate result</p>
    <div class="hero-f-cabinet surface-hi">
      <div class="hero-f-window">
        <p class="hero-f-reels display" data-reels aria-hidden="true"></p>
      </div>
      <span class="sr-only" data-bind="score">1,000,000</span>
    </div>
    <div class="hero-f-bulbs" data-bind="charge" aria-hidden="true"><span class="hero-f-lit"></span></div>
    <p class="hero-f-grade display" data-bind="grade">Perfect punch</p>
  </div>
</div>
