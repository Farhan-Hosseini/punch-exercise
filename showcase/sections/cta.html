<div class="var v-a" data-name="Full button">
  <p class="cta">Punch again</p>
</div>
<div class="var v-b" data-name="Button pair">
  <div class="cta-b-pair">
    <p class="display strike-fill cta-b-play"><span class="cta-b-word">Punch again</span></p>
    <div class="surface cta-b-save">
      <span class="cta-b-icon" data-lucide="circle-check" data-lucide-stroke="1.5" aria-hidden="true"></span>
      <span class="cta-b-txt"><span class="label cta-b-cap">On your phone</span><span class="text cta-b-say">Replay and score saved</span></span>
    </div>
  </div>
</div>
<div class="var v-c" data-name="Countdown">
  <div class="cta-c-dock">
    <p class="label cta-c-next">Next player in</p>
    <p class="display strike-fill cta-c-play"><span class="cta-c-word">Punch again</span></p>
    <div class="cta-c-clock" role="img" aria-label="12 seconds left">
      <svg class="cta-c-ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="cta-c-track" cx="100" cy="100" r="86" pathLength="100"/>
        <circle class="cta-c-left" cx="100" cy="100" r="86" pathLength="100"/>
      </svg>
      <p class="cta-c-read" aria-hidden="true"><span class="display cta-c-num">12</span><span class="label cta-c-unit">sec</span></p>
    </div>
  </div>
</div>
<div class="var v-d" data-name="Code handoff">
  <div class="cta-d-row">
    <p class="display strike-fill cta-d-play"><span class="cta-d-word">Punch again</span></p>
    <div class="cta-d-hand">
      <button type="button" class="cta-d-qr" data-qr aria-label="Scan this code on the phone"></button>
      <div class="cta-d-copy">
        <p class="text cta-d-keep">Scan to keep this hit</p>
        <p class="display cta-d-code">KTR BXM</p>
      </div>
    </div>
  </div>
</div>
<div class="var v-e" data-name="Big pad">
  <div class="cta-e-band" data-bleed>
    <span class="cta-e-waves" aria-hidden="true"></span>
    <div class="cta-e-pad">
      <svg class="cta-e-rings" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="99"/>
        <circle cx="100" cy="100" r="88.5"/>
      </svg>
      <p class="strike-fill cta-e-core" role="img" aria-label="Punch again">
        <svg class="cta-e-stitch" viewBox="0 0 156 156" aria-hidden="true"><circle cx="78" cy="78" r="65"/></svg>
        <svg class="cta-e-again" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </p>
    </div>
    <p class="label cta-e-hit">Hit to punch again</p>
  </div>
</div>
