<div class="var v-a" data-name="Card grid">
  <div class="grid">
    <div class="card rank"><span class="badge badge-rank" data-glyph="machine" aria-hidden="true"></span><div><p class="k">Machine</p><p class="v"><span class="in-arena" data-glass-rank="machine">#1</span></p></div></div>
    <div class="card rank"><span class="badge badge-rank" data-glyph="city" aria-hidden="true"></span><div><p class="k">City rank</p><p class="v"><span class="in-arena" data-glass-rank="city">#1</span></p></div></div>
    <div class="card rank"><span class="badge badge-rank" data-glyph="country" aria-hidden="true"></span><div><p class="k">Country</p><p class="v"><span class="in-arena" data-glass-rank="country">#1</span></p></div></div>
    <div class="card rank is-key"><span class="badge badge-rank" data-glyph="global" aria-hidden="true"></span><div><p class="k">Global rank</p><p class="v"><span class="in-arena" data-glass-rank="global">#1</span></p></div></div>
  </div>
</div>

<div class="var v-b" data-name="Podium">
  <div class="ranks-b-stage">
    <div class="surface-hi ranks-b-banner">
      <span class="badge ranks-b-badge-lg" data-glyph="global" aria-hidden="true"></span>
      <p class="label ranks-b-banner-label">Global rank</p>
      <div class="ranks-b-banner-num"><p class="display ranks-b-banner-value" data-glass-rank="global">#1</p></div>
    </div>
    <div class="ranks-b-podium">
      <div class="ranks-b-col ranks-b-left">
        <p class="label ranks-b-label">City rank</p>
        <p class="display ranks-b-value" data-glass-rank="city">#1</p>
        <div class="surface ranks-b-block"><span class="badge ranks-b-badge" data-glyph="city" aria-hidden="true"></span></div>
      </div>
      <div class="ranks-b-col ranks-b-mid">
        <p class="label ranks-b-label">Country</p>
        <p class="display ranks-b-value" data-glass-rank="country">#1</p>
        <div class="surface ranks-b-block"><span class="badge ranks-b-badge" data-glyph="country" aria-hidden="true"></span></div>
      </div>
      <div class="ranks-b-col ranks-b-right">
        <p class="label ranks-b-label">Machine</p>
        <p class="display ranks-b-value" data-glass-rank="machine">#1</p>
        <div class="surface ranks-b-block"><span class="badge ranks-b-badge" data-glyph="machine" aria-hidden="true"></span></div>
      </div>
    </div>
  </div>
</div>


<div class="var v-d" data-name="Scoreboard">
  <div class="surface-hi ranks-d-board">
    <div class="ranks-d-row ranks-d-key">
      <p class="label ranks-d-label">Global rank</p>
      <p class="display ranks-d-digits" data-glass-rank-tiles="global" aria-label="#1"><span class="ranks-d-hash">#</span><span class="ranks-d-tile">1</span></p>
    </div>
    <div class="ranks-d-row">
      <p class="label ranks-d-label">Country</p>
      <p class="display ranks-d-digits" data-glass-rank-tiles="country" aria-label="#1"><span class="ranks-d-hash">#</span><span class="ranks-d-tile">1</span></p>
    </div>
    <div class="ranks-d-row">
      <p class="label ranks-d-label">City rank</p>
      <p class="display ranks-d-digits" data-glass-rank-tiles="city" aria-label="#1"><span class="ranks-d-hash">#</span><span class="ranks-d-tile">1</span></p>
    </div>
    <div class="ranks-d-row">
      <p class="label ranks-d-label">Machine</p>
      <p class="display ranks-d-digits" data-glass-rank-tiles="machine" aria-label="#1"><span class="ranks-d-hash">#</span><span class="ranks-d-tile">1</span></p>
    </div>
  </div>
</div>

<div class="var v-e" data-name="Split slabs">
  <div class="ranks-e-stack">
    <div class="surface-hi ranks-e-slab ranks-e-key">
      <div class="ranks-e-in">
        <span class="badge ranks-e-badge" data-glyph="global" aria-hidden="true"></span>
        <p class="label ranks-e-label">Global rank</p>
        <p class="display ranks-e-value" data-glass-rank="global">#1</p>
      </div>
    </div>
    <div class="surface ranks-e-slab">
      <div class="ranks-e-in">
        <span class="badge ranks-e-badge" data-glyph="country" aria-hidden="true"></span>
        <p class="label ranks-e-label">Country</p>
        <p class="display ranks-e-value" data-glass-rank="country">#1</p>
      </div>
    </div>
    <div class="surface ranks-e-slab">
      <div class="ranks-e-in">
        <span class="badge ranks-e-badge" data-glyph="city" aria-hidden="true"></span>
        <p class="label ranks-e-label">City rank</p>
        <p class="display ranks-e-value" data-glass-rank="city">#1</p>
      </div>
    </div>
    <div class="surface ranks-e-slab">
      <div class="ranks-e-in">
        <span class="badge ranks-e-badge" data-glyph="machine" aria-hidden="true"></span>
        <p class="label ranks-e-label">Machine</p>
        <p class="display ranks-e-value" data-glass-rank="machine">#1</p>
      </div>
    </div>
  </div>
</div>
