<div class="var v-c" data-name="Slant cut">
  <figure class="photo-c-stage">
    <div class="photo-frame photo-c-cut"><img class="photo" src="assets/photos/lib/boxer-65.jpg" alt="A fighter raises his wrapped fists to his chin" width="1800" height="1200" loading="lazy" decoding="async"></div>
    <figcaption class="surface-hi photo-c-slab">
      <span class="photo-c-lines">
        <span class="display photo-c-title">Fight night</span>
      </span>
    </figcaption>
  </figure>
</div>
<div class="var v-b" data-name="Full bleed">
  <figure class="photo-b-band" data-bleed>
    <div class="photo-frame photo-b-frame"><img class="photo" src="assets/photos/lib/boxer-64.jpg" alt="A boxer in red gloves sets his guard in a dark gym" width="1800" height="1200" style="object-position: 55% 35%" loading="lazy" decoding="async"></div>
    <figcaption class="glass photo-b-panel">
      <span class="display photo-b-title">Tonight in the ring</span>
    </figcaption>
  </figure>
</div>


<div class="var v-d" data-name="Promo banner">
  <div class="photo-d-banner">
    <div class="photo-frame photo-d-shot">
      <img class="photo" src="assets/photos/lib/gloves-wrap-2.jpg" alt="" width="1800" height="1200" loading="lazy" decoding="async">
    </div>
    <div class="photo-d-copy">
      <p class="display photo-d-head"><span class="photo-d-lead">Train like the</span> <span class="photo-d-big">main event</span></p>
      <p class="label photo-d-brand">Monster Energy</p>
    </div>
  </div>
</div>

<div class="var v-e" data-name="Poster print">
  <div class="photo-e-wall">
    <div class="photo-e-stack">
      <figure class="surface photo-e-print">
        <div class="photo-frame photo-e-frame"><img class="photo" src="assets/photos/lib/gym-interior-2.jpg" alt="The corner of an empty ring, ropes lit by the gym windows" width="1800" height="1200" loading="lazy" decoding="async"></div>
        <figcaption class="photo-e-cap">
          <span class="text photo-e-title">Ringside at the main event</span>
        </figcaption>
        <span class="photo-e-tape" aria-hidden="true"></span>
      </figure>
    </div>
  </div>
</div>
