    <!-- ========== profile ==========
         Built from sections (psec.js), each with five designs chosen in Customise under This screen: Header, Stats,
         Hits and Badges, all drawn by mpages/profile.js (data-sv-names) from the model mobile.js keeps for the player
         on show. The bar on top (back, handle, more) is the page's own chrome. -->
    <section class="m-page m-scroll" data-page="profile" aria-labelledby="mProfileName">
      <header class="m-head m-head-bar">
        <button class="m-iconbtn" type="button" id="mProfileBack" aria-label="Back"><span data-icon="back"></span></button>
        <p class="m-handle" id="mProfileHandle">@sara.hits</p>
        <button class="m-iconbtn" type="button" id="mProfileMore" aria-label="More"><span data-icon="more"></span></button>
      </header>
      <div class="mp">
        <div class="mp-sec mp-header" id="mProfileHeader" data-sec="header" data-sec-label="Header" data-sv-names="Centred|Cover photo|Side by side|Portrait|Rank card"><h2 class="mp-name" id="mProfileName">Sara Malik</h2></div>
        <section class="mp-sec mp-stats" id="mProfileStats" data-sec="stats" data-sec-label="Stats" data-sv-names="Tiles|Headline|List|Streak week|Trend" aria-label="Stats"></section>
        <section class="mp-sec mp-hits" id="mHits" data-sec="hits" data-sec-label="Hits" data-sv-names="Grid|Best first|List|Carousel|Timeline" aria-labelledby="mHitsH"></section>
        <section class="mp-sec mp-badges" id="mBadges" data-sec="badges" data-sec-label="Badges" data-sv-names="Cards|Medals|Progress list|Next up|Photo tiles" aria-labelledby="mBadgesH"></section>
      </div>
    </section>
