<!-- The machine's header, shared by every flow screen: ONE global section (psec.js, data-sec-scope="global"), so a
     choice in Customise ("Across every screen") changes it on every screen at once. Its designs are its [data-sv]
     children, styled in mscreens/_brand.css; the clock is kept by mscreens/_brand.js. The wrapper takes no room of its
     own: every design sits in the band the old header held (--ms-brand-top, --ms-brand-h), so no screen moves. -->
<header class="ms-head" data-sec="mheader" data-sec-scope="global" data-sec-for="machine" data-sec-label="Header (machine)">
  <div class="ms-brand" data-sv="Lockup">
    <img class="ms-mark" data-logo-img src="assets/logos/fist-circle.svg" alt="" width="118" height="124" loading="lazy" decoding="async">
    <img class="ms-word ms-on-dark" src="assets/logos/punchapp-wordmark.svg" alt="PunchApp" width="452" height="98" loading="lazy" decoding="async">
    <img class="ms-word ms-on-light" src="assets/logos/punchapp-wordmark-dark.svg" alt="PunchApp" width="452" height="98" loading="lazy" decoding="async">
  </div>
  <div class="msh msh-venue" data-sv="Venue and clock">
    <div class="msh-lock">
      <img class="msh-mark" data-logo-img src="assets/logos/fist-circle.svg" alt="" width="118" height="124" loading="lazy" decoding="async">
      <img class="msh-word ms-on-dark" src="assets/logos/punchapp-wordmark.svg" alt="PunchApp" width="452" height="98" loading="lazy" decoding="async">
      <img class="msh-word ms-on-light" src="assets/logos/punchapp-wordmark-dark.svg" alt="PunchApp" width="452" height="98" loading="lazy" decoding="async">
    </div>
    <div class="msh-where">
      <p class="msh-clock" data-ms-clock>21:40</p>
      <p class="msh-place"><span data-lucide="map-pin"></span>Dubai Mall, Ground Level</p>
    </div>
  </div>
  <div class="msh msh-bar" data-sv="Slim bar">
    <div class="msh-bar-in">
      <div class="msh-lock">
        <img class="msh-mark" data-logo-img src="assets/logos/fist-circle.svg" alt="" width="118" height="124" loading="lazy" decoding="async">
        <img class="msh-word ms-on-dark" src="assets/logos/punchapp-wordmark.svg" alt="PunchApp" width="452" height="98" loading="lazy" decoding="async">
        <img class="msh-word ms-on-light" src="assets/logos/punchapp-wordmark-dark.svg" alt="PunchApp" width="452" height="98" loading="lazy" decoding="async">
      </div>
      <p class="msh-live"><span class="msh-dot" aria-hidden="true"></span>Live</p>
      <p class="msh-unit"><span data-lucide="gamepad-2"></span>Machine 07</p>
    </div>
  </div>
  <div class="msh msh-crest" data-sv="Crest">
    <p class="msh-side msh-side-l"><span data-lucide="map-pin"></span>Dubai Mall</p>
    <span class="msh-ring">
      <img class="msh-mark" data-logo-img src="assets/logos/fist-circle.svg" alt="PunchApp" width="118" height="124" loading="lazy" decoding="async">
    </span>
    <p class="msh-side msh-side-r"><span data-lucide="clock"></span><span data-ms-clock>21:40</span></p>
  </div>
  <div class="msh msh-stack" data-sv="Stacked">
    <img class="msh-mark" data-logo-img src="assets/logos/fist-circle.svg" alt="" width="118" height="124" loading="lazy" decoding="async">
    <img class="msh-word ms-on-dark" src="assets/logos/punchapp-wordmark.svg" alt="PunchApp" width="452" height="98" loading="lazy" decoding="async">
    <img class="msh-word ms-on-light" src="assets/logos/punchapp-wordmark-dark.svg" alt="PunchApp" width="452" height="98" loading="lazy" decoding="async">
  </div>
</header>
