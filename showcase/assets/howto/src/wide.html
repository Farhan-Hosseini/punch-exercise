<!doctype html>
<html lang="en" data-variant="arena" data-appearance="dark">
<head>
<meta charset="utf-8">
<base href="/">
<title>How to scan, wide</title>
<!-- The wide how-to picture for the phone's How to use sheet and the machine's scan screen: our column with the scan screen on its glass, and a hand holding the phone up to it, reading the code.
     Rendered by render.mjs in this folder (1568 x 760 or 720 x 720, transparent). Open it with ?a=light for the light look. -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/qr.css">
<link rel="stylesheet" href="/assets/howto/src/howto.css">
</head>
<body>
<div class="scene scene-wide">
  <i class="pool pool-warm" style="left:120px;top:-70px;width:330px;height:190px"></i>
  <i class="pool pool-red" style="left:70px;top:20px;width:520px;height:380px"></i>
  <i class="pool pool-floor" style="left:150px;top:330px;width:480px;height:70px"></i>
  <div class="col" id="m" data-glass="scan" style="--x:196px;--y:20px;--w:172px;--fade-a:268px;--fade-b:352px"></div>
  <svg class="beam" data-from="#m .pqr-frame" data-to="#p .ph-qr" aria-hidden="true"></svg>
  <div class="phone" id="p" data-screen="reading" data-grip="hold" style="--x:426px;--y:62px;--w:134px;--rot:-8deg"></div>
</div>
<script src="/qr.js"></script>
<script src="/assets/howto/src/howto.js"></script>

</html>
